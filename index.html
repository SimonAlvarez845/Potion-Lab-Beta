<!-- Se precargaron dos familias de fuentes (Cinzel y Manrope)
 
Para Cinzel se solicitaron los pesos (grosor fuente):
500, 600 y 700.

Para Manrope se solicitaron los pesos (grosor fuente):
400, 500, 600, 700 y 800.

En el CSS nos aseguramos de que todo el proyecto usara como propiedad una de esas font families.

Tambien se utilizo mucho la propiedad swap para mostrar temporalmente una fuente normal mientras se descarga la fuente de Google API. Asi evitamos que el texto permanezca invisible o se demore en cargar. -->
